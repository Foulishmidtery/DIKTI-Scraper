<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'" />
    <title>PDDIKTI Scraper</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        color: #173126;
        font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 12% 10%, rgba(18,109,163,.16), transparent 42%),
          radial-gradient(circle at 88% 90%, rgba(0,152,74,.17), transparent 45%),
          linear-gradient(145deg, #fbfefd, #edf7f1);
        border: 1px solid rgba(25,91,59,.14);
      }
      main { width: 100%; padding: 42px 54px 34px; text-align: center; }
      img { width: 280px; height: auto; display: block; margin: 0 auto 27px; }
      h1 { margin: 0; font-size: 25px; line-height: 1.2; letter-spacing: -.035em; }
      p { margin: 8px 0 25px; color: #718078; font-size: 13px; }
      .loader { width: 190px; height: 5px; overflow: hidden; margin: 0 auto 15px; border-radius: 999px; background: rgba(15,91,54,.1); }
      .loader::after { content: ""; display: block; width: 45%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #126da3, #00a650, #8dbb39); animation: load 1.15s ease-in-out infinite; }
      small { color: #8a9690; font-size: 11px; letter-spacing: .04em; }
      @keyframes load { from { transform: translateX(-110%); } to { transform: translateX(330%); } }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/kneks-logo.png" alt="KNEKS" />
      <h1>PDDIKTI Scraper</h1>
      <p>Menyiapkan database dan layanan scraper…</p>
      <div class="loader" aria-label="Memuat"></div>
      <small>KNEKS Data Workspace</small>
    </main>
  </body>
</html>
