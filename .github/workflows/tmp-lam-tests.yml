name: Temporary LAM scraper tests

on:
  push:
    branches:
      - fix/lamemba-lamspak-source-availability

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run accreditation unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install live-smoke dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Live SAPTO and Bianglala smoke test
        run: |
          python - <<'PY'
          from scraper.prodi_enrichment import enrich_banpt
          result = enrich_banpt({"pt":"Universitas Indonesia","nama":"Akuntansi","jenjang":"S1","kode_pt":"001002","kode_prodi":"62201"})
          print("BANPT", result)
          assert result["status_pencocokan_akreditasi"] == "terverifikasi", result
          assert result["peringkat_akreditasi_banpt"], result
          assert result["tanggal_akhir_akreditasi"], result
          PY
      - name: Probe verified LAMEMBA code pairs
        run: |
          python - <<'PY'
          import concurrent.futures, html, re, requests
          url="https://lamemba.or.id/connect_pddikti/"
          pairs=[
              ("041043","62201","Universitas Majalengka","Akuntansi"),
              ("031079","62201","Universitas Jakarta Internasional","Akuntansi"),
              ("021029","62201","Universitas Mitra Indonesia","Akuntansi"),
          ]
          def probe(item):
              kode_pt,kode_ps,pt,prodi=item
              try:
                  r=requests.post(url,data={"kode_pt":kode_pt,"kode_ps":kode_ps,"step1":""},timeout=70,headers={"User-Agent":"Mozilla/5.0","Accept":"text/html"})
                  text=r.text
                  tbody=re.search(r'<table[^>]*id="pddiktiTable"[^>]*>.*?<tbody>(.*?)</tbody>',text,re.I|re.S)
                  body=tbody.group(1) if tbody else ""
                  plain=' '.join(html.unescape(re.sub(r'<[^>]+>',' ',body)).split())
                  alerts=[]
                  for m in re.findall(r'<(?:div|p)[^>]*class=["\'][^"\']*(?:alert|notice|error|warning)[^"\']*["\'][^>]*>(.*?)</(?:div|p)>',text,re.I|re.S):
                      alerts.append(' '.join(html.unescape(re.sub(r'<[^>]+>',' ',m)).split()))
                  context=[]
                  for key in ("gagal","error","tidak ditemukan","curl","timeout","pddikti"):
                      for m in re.finditer(key,text,re.I):
                          s=' '.join(html.unescape(re.sub(r'<[^>]+>',' ',text[max(0,m.start()-250):m.start()+700])).split())
                          if s not in context: context.append(s[:900])
                          if len(context)>=8: break
                  return item,r.status_code,len(text),plain[:5000],alerts[:10],context[:8]
              except Exception as exc:
                  return item,"EXC",0,"",[],[repr(exc)]
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
              results=list(ex.map(probe,pairs))
          any_rows=False
          for item,status,size,plain,alerts,context in results:
              print("\n===",item,"status",status,"bytes",size,"===")
              print("TABLE:",plain)
              print("ALERTS:",alerts)
              print("CONTEXT:",context)
              any_rows = any_rows or bool(plain)
          print("ANY_ROWS",any_rows)
          PY