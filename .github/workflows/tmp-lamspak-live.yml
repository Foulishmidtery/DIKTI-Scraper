name: Temporary LAMSPAK live verification

on:
  push:
    branches:
      - fix/lamemba-lamspak-source-availability

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Live full LAMSPAK fallback
        run: |
          python - <<'PY'
          from unittest.mock import patch
          from scraper.prodi_enrichment import enrich_banpt
          from scraper import accreditation_sources as sources

          prodi = {
              "pt": "Universitas Padjadjaran",
              "nama": "Hubungan Masyarakat",
              "jenjang": "S1",
              "kode_pt": "",
              "kode_prodi": "",
          }
          national = enrich_banpt(prodi)
          print("BANPT=", national)
          assert national["status_pencocokan_akreditasi"] == "terverifikasi", national
          assert national["peringkat_akreditasi_banpt"], national
          merged = {**prodi, **national}

          # The official LAMSPAK result page currently states that accreditation
          # data is unavailable; emulate exactly that page state so this live test
          # exercises the production fallback without depending on page latency.
          with patch.object(sources, "_read", return_value="<p>Data akreditasi tidak tersedia.</p>"):
              lam = sources.enrich_national(merged)
          print("LAM=", lam)
          assert lam["status_pencocokan_lam"] == "terverifikasi melalui register nasional", lam
          assert lam["cakupan_lam_terpilih"] == ["LAMSPAK"], lam
          assert lam["peringkat_akreditasi_nasional"], lam
          assert "lembaga_akreditasi_nasional" not in lam, lam
          PY
