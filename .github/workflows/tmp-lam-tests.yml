name: Temporary LAM scraper tests

on:
  push:
    branches:
      - fix/lamemba-lamspak-source-availability

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run accreditation unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install live-smoke dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Live SAPTO and Bianglala smoke test
        run: |
          python - <<'PY'
          from scraper.prodi_enrichment import enrich_banpt
          result = enrich_banpt({"pt":"Universitas Indonesia","nama":"Akuntansi","jenjang":"S1","kode_pt":"","kode_prodi":""})
          print(result)
          assert result["status_pencocokan_akreditasi"] == "terverifikasi", result
          assert result["peringkat_akreditasi_banpt"], result
          assert result["tanggal_akhir_akreditasi"], result
          PY
      - name: Inspect LAMEMBA lookup block context
        run: |
          python - <<'PY'
          import html, re, requests
          url="https://lamemba.or.id/connect_pddikti/"
          text=requests.get(url,timeout=30,headers={"User-Agent":"Mozilla/5.0"}).text
          print("bytes",len(text))
          for needle in ("pddiktiTable","Kode PT","kode_pt","kodeProdi","kode_prodi","Ambil Data","ambilData"):
              print("\n### NEEDLE",needle)
              start=0
              count=0
              while True:
                  pos=text.lower().find(needle.lower(),start)
                  if pos<0 or count>=8: break
                  print(html.unescape(text[max(0,pos-900):pos+2600]).replace("\n"," ")[:3500])
                  start=pos+len(needle); count+=1
          scripts=re.findall(r"<script\\b[^>]*>(.*?)</script>",text,re.I|re.S)
          for i,block in enumerate(scripts):
              if "pddiktiTable" in block or "kode_pt" in block.lower() or "kode_prodi" in block.lower():
                  print("\n### SCRIPT BLOCK",i,"len",len(block))
                  print(html.unescape(block)[:12000])
          PY
