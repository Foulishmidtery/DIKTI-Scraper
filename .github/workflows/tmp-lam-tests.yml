name: Temporary LAM scraper tests

on:
  push:
    branches:
      - fix/lamemba-lamspak-source-availability

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run accreditation unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
