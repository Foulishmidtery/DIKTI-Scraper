services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pddikti}
      POSTGRES_USER: ${POSTGRES_USER:-pddikti_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
    ports:
      - "${POSTGRES_PUBLIC_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/02_schema.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pddikti_app} -d ${POSTGRES_DB:-pddikti}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      FLASK_HOST: 0.0.0.0
      PDDIKTI_OUTPUT_DIR: /app/output
      PDDIKTI_FRONTEND_ORIGINS: http://localhost:${FRONTEND_PUBLIC_PORT:-8080},http://127.0.0.1:${FRONTEND_PUBLIC_PORT:-8080}
    ports:
      - "${BACKEND_PUBLIC_PORT:-5000}:5000"
    volumes:
      - ./storage/output:/app/output
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PUBLIC_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
