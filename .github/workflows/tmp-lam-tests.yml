name: Temporary LAM scraper tests

on:
  push:
    branches:
      - fix/lamemba-lamspak-source-availability

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run accreditation unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install live-smoke dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Live SAPTO and Bianglala smoke test
        run: |
          python - <<'PY'
          from scraper.prodi_enrichment import enrich_banpt
          result = enrich_banpt({"pt":"Universitas Indonesia","nama":"Akuntansi","jenjang":"S1","kode_pt":"001002","kode_prodi":"62201"})
          print("BANPT", result)
          assert result["status_pencocokan_akreditasi"] == "terverifikasi", result
          assert result["peringkat_akreditasi_banpt"], result
          assert result["tanggal_akhir_akreditasi"], result
          PY
      - name: Live LAMEMBA PDDIKTI POST lookup
        run: |
          python - <<'PY'
          import html, re, requests
          url="https://lamemba.or.id/connect_pddikti/"
          r=requests.post(url,data={"kode_pt":"001002","kode_ps":"62201","step1":""},timeout=40,headers={"User-Agent":"Mozilla/5.0","Accept":"text/html"})
          r.raise_for_status()
          text=r.text
          print("status",r.status_code,"bytes",len(text))
          tbody=re.search(r'<table[^>]*id="pddiktiTable"[^>]*>.*?<tbody>(.*?)</tbody>',text,re.I|re.S)
          body=tbody.group(1) if tbody else ""
          print("TBODY",html.unescape(re.sub(r'<[^>]+>',' | ',body))[:6000])
          rows=re.findall(r'<tr\\b[^>]*>(.*?)</tr>',body,re.I|re.S)
          print("rows",len(rows))
          assert rows, "LAMEMBA POST returned no rows"
          plain=' '.join(html.unescape(re.sub(r'<[^>]+>',' ',body)).split())
          assert "Universitas Indonesia".lower() in plain.lower(), plain
          assert "Akuntansi".lower() in plain.lower(), plain
          assert re.search(r'\\bSK\\b|/SK/|AK\\.',plain,re.I), plain
          PY
