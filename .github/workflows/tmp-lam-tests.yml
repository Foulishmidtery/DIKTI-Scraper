name: Temporary LAM scraper tests

on:
  push:
    branches:
      - fix/lamemba-lamspak-source-availability

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run accreditation unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install live-smoke dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Live SAPTO and Bianglala smoke test
        run: |
          python - <<'PY'
          from scraper.prodi_enrichment import enrich_banpt

          result = enrich_banpt({
              "pt": "Universitas Indonesia",
              "nama": "Akuntansi",
              "jenjang": "S1",
              "kode_pt": "",
              "kode_prodi": "",
          })
          print(result)
          assert result["status_pencocokan_akreditasi"] == "terverifikasi", result
          assert result["peringkat_akreditasi_banpt"], result
          assert result["tanggal_akhir_akreditasi"], result
          assert result["url_sumber_akreditasi"], result
          PY
      - name: Inspect public directory endpoint hints
        run: |
          python - <<'PY'
          import re, requests
          for url in (
              "https://lamemba.or.id/connect_pddikti/",
              "https://www.banpt.or.id/direktori/prodi/pencarian_prodi.php",
          ):
              text = requests.get(url, timeout=30, headers={"User-Agent": "Mozilla/5.0"}).text
              print("\n===", url, "status-bytes", len(text), "===")
              scripts = re.findall(r"<script\\b[^>]*>(.*?)</script>", text, re.I | re.S)
              joined = "\n".join(scripts)
              for line in joined.splitlines():
                  low = line.lower()
                  if any(key in low for key in ("ajax", "fetch(", "admin-ajax", "kode_pt", "kode_prodi", "datatable", ".php")):
                      print(line.strip()[:1500])
          PY
